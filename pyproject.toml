[build-system]
requires = ["hatchling", "hatch-vcs>=0.3"]
build-backend = "hatchling.build"

[project]
name = "metaflow-durability"
description = "Turns agent loops into durable, traceable, forkable work graphs on Metaflow"
dynamic = ["version"]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "metaflow>=2.17.4",
    "openai-function-calling>=2.0",
]

[project.urls]
repository = "https://github.com/Anaconda-Labs/metaflow-durability"

[project.optional-dependencies]
pydantic-ai = [
    "pydantic-ai-slim>=2.52",
    "markdown>=3.5",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "mypy",
    "ruff",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/metaflow_durability/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/metaflow_durability", "src/metaflow_extensions"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["metaflow_durability"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--color=yes", "-vv"]

[tool.mypy]
python_version = "3.11"
files = ["src/**/*.py"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "metaflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "markdown.*"
ignore_missing_imports = true
